# material.nvim "darker" palette for kitty.
#
# Source of truth: material.nvim lua/material/colors/init.lua (palette) and
# lua/material/highlights/init.lua (which palette color goes in which ANSI
# slot, the terminal_color_0..15 block). Matching that mapping means ls, git,
# herdr and anything else in kitty use the same colors as nvim.

# Keeping the accent color here for now when we need it
#   accent #FF9800
background #212121
foreground #B0BEC5
selection_background #404040
cursor #FFCC00
selection_foreground #EEFFFF
cursor_text_color    background
url_color            #80CBC4

# ANSI colors. Slots 0-7 are "normal", 8-15 are "bright".
# Order: black, red, green, yellow, blue, magenta, cyan, white.
color0  #000000
color1  #DC6068
color2  #ABCF76
color3  #E6B455
color4  #6E98EB
color5  #B480D6
color6  #71C6E7
color7  #EEFFFF

color8  #474747
color9  #F07178
color10 #C3E88D
color11 #FFCB6B
color12 #82AAFF
color13 #C792EA
color14 #89DDFF
color15 #EEFFFF
