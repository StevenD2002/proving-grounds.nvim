# proving-grounds kitty settings.
#
# Install: this kitty/ folder is symlinked to ~/.config/kitty/proving-grounds,
# and the LAST line of ~/.config/kitty/kitty.conf is
#   include proving-grounds/proving-grounds.conf
# Later lines win in kitty config, so these override anything above them.
# Includes inside this file resolve relative to THIS file's directory.
#
# Reload without restarting kitty: ctrl+cmd+,
# Gotcha: an unknown font family name fails SILENTLY (kitty falls back to the
# previous font). Use the family names kitty itself reports, e.g. from
# `kitten choose-fonts`, not the names macOS Font Book / mdls show.

# Font ------------------------------------------------------------------------
# Monaspace (GitHub Next), via its Nerd Font build "Monaspice".
# NFM = Nerd Font Mono: icons are exactly one cell wide, so columns line up.
# Neon (Ne) for code; Radon (Rn, handwriting) for italics, i.e. comments.
font_family      family="MonaspiceNe Nerd Font Mono"
bold_font        family="MonaspiceNe Nerd Font Mono" style=Bold
italic_font      family="MonaspiceRn Nerd Font Mono" style=Italic
bold_italic_font family="MonaspiceRn Nerd Font Mono" style="Bold Italic"
# font_size 13.0

# Texture healing (Monaspace's trick of letting narrow letters lend width to
# wide neighbours) is the `calt` feature: on. Coding ligatures (`liga`): off.
# font_features takes PostScript names.
font_features MonaspiceNeNFM            +calt -liga
font_features MonaspiceNeNFM-Bold       +calt -liga
font_features MonaspiceRnNFM-Italic     +calt -liga
font_features MonaspiceRnNFM-BoldItalic +calt -liga

# Colors ----------------------------------------------------------------------
include material-darker.conf
